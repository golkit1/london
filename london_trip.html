<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>לונדון — שבוע עבודה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --navy: #0B1F3A;
    --navy-2: #122A4E;
    --paper: #F2EFE9;
    --red: #E13A2E;
    --gold: #C9A227;
    --slate: #7A8AA0;
    --line: rgba(242,239,233,0.14);
    --ok: #4C9A6A;
    --field-bg: rgba(0,0,0,0.18);
  }
  body.light{
    --navy: #F5F1E8;
    --navy-2: #FFFFFF;
    --paper: #1C2430;
    --red: #C22A20;
    --gold: #97721B;
    --slate: #6B7385;
    --line: rgba(28,36,48,0.12);
    --ok: #2F7A4F;
    --field-bg: rgba(28,36,48,0.05);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--navy);
    color: var(--paper);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
    transition: background .2s, color .2s;
  }
  body.light .stop::before{ background: var(--navy-2); }
  .wrap{max-width: 640px; margin: 0 auto; padding: 0 16px;}

  header.top{
    padding: 28px 16px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--navy-2), var(--navy) 90%);
  }
  header.top .wrap{display:flex; flex-direction:column; gap:4px; position:relative;}
  .theme-toggle{
    position:absolute; left:0; top:0;
    background: var(--navy-2); border:1px solid var(--line);
    color: var(--paper);
    width: 38px; height:38px; border-radius:50%;
    font-size: 16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .sync-status{
    display:flex; align-items:center; gap:6px; margin-top:8px;
    font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--slate);
  }
  .sync-dot{
    width:8px; height:8px; border-radius:50%; background: var(--slate); flex-shrink:0;
  }
  .sync-dot.ok{ background: var(--ok); }
  .sync-dot.error{ background: var(--red); }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
  }
  h1{
    font-family:'Suez One', serif;
    font-size: 34px;
    margin: 2px 0 2px;
    font-weight: 400;
  }
  .subtitle{color: var(--slate); font-size: 14px;}

  nav.tabs{
    display:flex;
    position: sticky; top:0; z-index: 10;
    background: var(--navy);
    border-bottom: 1px solid var(--line);
  }
  nav.tabs .wrap{
    display:flex; padding:0 16px; gap: 4px;
    overflow-x:auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  nav.tabs .wrap::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex:0 0 auto;
    white-space: nowrap;
    background: none; border:none;
    color: var(--slate);
    font-family:'Heebo', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 10px 12px;
    cursor:pointer;
    border-bottom: 3px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab-btn.active{ color: var(--paper); border-bottom-color: var(--red); }
  .tab-btn.dragging{ opacity: 0.4; }

  section.view{ display:none; padding: 22px 0 10px; }
  section.view.active{ display:block; }

  /* ---- Places (station line) ---- */
  .line-track{ position:relative; padding-inline-start: 26px; }
  .line-track::before{
    content:"";
    position:absolute;
    inset-inline-start: 8px;
    top: 6px; bottom: 6px;
    width: 3px;
    background: linear-gradient(var(--red), var(--gold));
    border-radius: 3px;
  }
  .stop{
    position: relative;
    margin-bottom: 16px;
    background: var(--navy-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .stop::before{
    content:"";
    position:absolute;
    inset-inline-start: -26px;
    top: 20px;
    width: 13px; height:13px;
    border-radius: 50%;
    background: var(--paper);
    border: 3px solid var(--red);
  }
  .stop.done::before{ border-color: var(--ok); }
  .stop.collapsed{ padding-bottom: 14px; }
  .stop.collapsed .stop-body{ display:none; }
  .stop.dragging{ opacity: 0.4; }
  .drag-handle{
    cursor: grab; color: var(--slate); font-size: 15px;
    padding: 2px 4px; flex-shrink:0; user-select:none; touch-action:none;
  }
  .drag-handle:active{ cursor: grabbing; }
  .stop-head{ display:flex; align-items:flex-start; justify-content: space-between; gap:8px; }
  .collapse-toggle{
    background:none; border:none; color: var(--slate);
    font-size: 14px; cursor:pointer; padding: 4px 4px; line-height:1;
    flex-shrink:0;
  }
  .stop-name{
    font-family:'Heebo', sans-serif;
    font-weight: 800;
    font-size: 17px;
    background: transparent; border:none; color: var(--paper);
    width: 100%;
    padding: 2px 0;
  }
  .stop-name:focus{ outline: none; border-bottom: 1px solid var(--gold); }
  .stop-links{ margin-bottom: 6px; }
  .stop-add-link{
    background:none; border:1px dashed var(--line); color: var(--slate);
    font-family:'Heebo', sans-serif; font-size: 12px; font-weight:700;
    padding: 6px 12px; border-radius: 999px; cursor:pointer; margin-bottom: 8px;
  }
  .stop-notes{
    width:100%;
    background: var(--field-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--paper);
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    resize: vertical;
    min-height: 36px;
  }
  .stop-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap: wrap; align-items:center;}
  .nav-btn{
    display:flex; align-items:center; gap:5px;
    font-size: 12px; font-weight:700;
    padding: 7px 12px;
    border-radius: 999px;
    text-decoration:none;
    border:1px solid var(--line);
    color: var(--paper);
  }
  .nav-btn.gmaps{ background: rgba(76,154,106,0.14); border-color: var(--ok);}
  .done-toggle{
    margin-inline-start:auto;
    font-size: 11px; color: var(--slate);
    display:flex; align-items:center; gap:5px; cursor:pointer;
    user-select:none;
  }
  .del-stop{
    background:none; border:none; color: var(--slate);
    font-size: 18px; cursor:pointer; padding: 0 2px; line-height:1;
  }
  .add-row{
    display:flex; justify-content:center; margin-top: 6px;
  }
  .add-btn{
    background: var(--red); color: var(--paper);
    border:none; border-radius: 999px;
    font-family:'Heebo',sans-serif; font-weight:700; font-size:14px;
    padding: 11px 22px; cursor:pointer;
    box-shadow: 0 4px 14px rgba(225,58,46,0.35);
  }

  /* ---- Budget ---- */
  .budget-summary{
    display:flex; justify-content:space-between; align-items:baseline;
    background: var(--navy-2); border:1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  }
  .budget-summary .label{ font-size:13px; color:var(--slate); }
  .budget-summary .amount{
    font-family:'JetBrains Mono', monospace; font-size: 26px; font-weight:700;
  }
  .budget-summary .amount.over{ color: var(--red); }
  .budget-summary .amount-sub{
    font-family:'JetBrains Mono', monospace; font-size: 13px; color: var(--slate); margin-top:2px;
  }
  .b-row{
    display:flex; flex-direction:column; gap:8px;
    background: var(--navy-2);
    border:1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .b-row.dragging{ opacity: 0.4; }
  .b-row input, .b-row textarea{
    background: var(--field-bg);
    border:1px solid var(--line);
    border-radius:7px;
    color: var(--paper);
    font-family:'Heebo',sans-serif;
    font-size: 13px;
    padding: 7px 8px;
  }
  .b-row-top{ display:flex; align-items:center; gap:8px; }
  .b-row-top input[data-field="desc"]{
    flex:1; min-width:0; font-weight:700; font-size: 14px;
  }
  .b-row-bottom{ display:flex; align-items:center; gap:8px; flex-wrap: wrap; }
  .b-row input.date{
    flex: 0 0 auto; width: 88px;
    font-family:'JetBrains Mono', monospace; font-size:11px; text-align:center;
    padding: 7px 2px; color-scheme: dark;
  }
  body.light .b-row input.date{ color-scheme: light; }
  .amt-cell{ display:flex; gap:4px; flex: 0 0 auto; }
  .amt-cell input.num{ width: 64px; font-family:'JetBrains Mono', monospace; text-align:center; padding: 7px 4px; }
  .cur-toggle{
    flex-shrink:0; width: 30px;
    background: var(--field-bg); border:1px solid var(--line);
    border-radius: 7px; color: var(--paper);
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size: 12px;
    cursor: pointer;
  }
  .b-row .b-notes{
    width:100%;
    resize: vertical;
    min-height: 30px;
    font-size: 12px;
  }
  .b-row .b-notes.hidden{ display:none; }
  .notes-toggle{
    background:none; border:none; color: var(--slate);
    font-size: 14px; cursor:pointer; padding: 2px; line-height:1;
    margin-inline-start: auto;
  }
  .notes-toggle.active{ color: var(--gold); }

  .empty{ text-align:center; color: var(--slate); font-size:14px; padding: 30px 10px; }

  /* ---- Flights ---- */
  .flight-card{
    background: var(--navy-2); border:1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 16px;
    position: relative; overflow:hidden;
  }
  .flight-card::before{
    content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px;
    background: var(--red);
  }
  .flight-card.return::before{ background: var(--gold); }
  .flight-label{
    font-family:'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px;
    color: var(--slate); text-transform: uppercase; margin-bottom: 4px;
  }
  .flight-route{
    font-family:'Suez One', serif; font-size: 20px; margin-bottom: 10px;
  }
  .flight-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 10px;
  }
  .flight-field{ display:flex; flex-direction:column; gap:3px; }
  .flight-field label{
    font-family:'JetBrains Mono', monospace; font-size: 10px; color: var(--slate);
  }
  .flight-field input{
    background: var(--field-bg); border:1px solid var(--line); border-radius:7px;
    color: var(--paper); font-family:'Heebo', sans-serif; font-size: 13px;
    padding: 6px 8px;
  }
  .flight-notes{
    width:100%; background: var(--field-bg); border:1px solid var(--line);
    border-radius: 8px; color: var(--paper); font-family:'Heebo', sans-serif;
    font-size: 12px; padding: 8px 10px; resize: vertical; min-height: 32px;
  }
  .flight-disclaimer{
    font-size: 11px; color: var(--slate); text-align:center; padding: 4px 10px 14px;
  }

  /* ---- Gear ---- */
  .gear-cat{
    background: var(--navy-2); border:1px solid var(--line);
    border-radius: 12px; padding: 14px 14px 10px; margin-bottom: 14px;
  }
  .gear-cat.dragging{ opacity: 0.4; }
  .gear-cat-head{
    display:flex; align-items:center; gap:8px; margin-bottom: 10px;
  }
  .gear-cat-title{
    flex:1; background: transparent; border:none; color: var(--paper);
    font-family:'Suez One', serif; font-size: 16px;
    padding: 2px 0;
  }
  .gear-cat-title:focus{ outline:none; border-bottom: 1px solid var(--gold); }
  .gear-cat-progress{
    font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--slate);
    white-space: nowrap;
  }
  .gear-progress-track{
    height: 3px; background: var(--line); border-radius: 2px; overflow:hidden;
    margin-bottom: 12px;
  }
  .gear-progress-bar{ height:100%; background: var(--ok); border-radius:2px; transition: width .25s; }
  .gear-row{
    display:flex; align-items:center; gap:8px; flex-wrap: wrap;
    padding: 7px 0;
    border-top: 1px solid var(--line);
  }
  .gear-row.dragging{ opacity: 0.4; }
  .gear-row:first-of-type{ border-top: none; }
  .gear-row input[type="checkbox"]{ width:16px; height:16px; flex-shrink:0; }
  .gear-name{
    flex:1; min-width:0; background: transparent; border:none; color: var(--paper);
    font-family:'Heebo', sans-serif; font-weight:500; font-size: 14px;
    padding: 4px 0;
  }
  .gear-name:focus{ outline:none; border-bottom: 1px solid var(--gold); }
  .gear-row.checked .gear-name{ text-decoration: line-through; color: var(--slate); }
  .task-link-toggle{
    background:none; border:none; color: var(--slate);
    font-size: 12px; cursor:pointer; padding: 2px; line-height:1; flex-shrink:0;
    opacity: 0.5;
  }
  .task-link-toggle.active{ color: var(--gold); opacity:1; }
  .task-link-row{
    flex-basis: 100%; display:flex; gap:6px; margin-top: 4px;
  }
  .task-link-row.hidden{ display:none; }
  .task-link-row input{
    flex:1; min-width:0; background: var(--field-bg); border:1px solid var(--line);
    border-radius: 7px; color: var(--paper); font-family:'JetBrains Mono', monospace;
    font-size: 11px; padding: 6px 8px;
  }
  .task-link-open{
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    width: 26px; background: var(--field-bg); border:1px solid var(--line);
    border-radius: 7px; color: var(--gold); text-decoration:none; font-size: 12px;
  }
  .task-link-item{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding: 5px 0;
  }
  .task-link-item-label{
    flex:1; min-width:0; font-family:'Heebo', sans-serif; font-size: 13px; color: var(--paper);
    background: transparent; border:none; padding: 4px 0;
  }
  .task-link-item-label:focus{ outline:none; border-bottom: 1px solid var(--gold); color: var(--paper); }
  .task-link-item-label::placeholder{ color: var(--slate); }
  .gear-cat-addrow{ display:flex; justify-content:flex-start; margin-top: 8px; }
  .gear-add-item{
    background:none; border:1px dashed var(--line); color: var(--slate);
    font-family:'Heebo', sans-serif; font-size: 12px; font-weight:700;
    padding: 6px 12px; border-radius: 999px; cursor:pointer;
  }

  /* ---- Days ---- */
  .day-strip{
    display:flex; gap:8px; overflow-x:auto; padding: 2px 2px 12px;
    -webkit-overflow-scrolling: touch;
  }
  .day-strip::-webkit-scrollbar{ height: 4px; }
  .day-pill{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px;
    width: 52px; padding: 10px 0 12px;
    background: var(--navy-2); border:1px solid var(--line); border-radius: 16px;
    cursor:pointer; color: var(--paper);
  }
  .day-pill.active{ border-color: var(--gold); background: rgba(201,162,39,0.12); }
  .day-pill-wd{ font-family:'Heebo', sans-serif; font-size: 11px; color: var(--slate); }
  .day-pill-num{ font-family:'JetBrains Mono', monospace; font-size: 18px; font-weight:700; }
  .day-pill-dot{ width:7px; height:7px; border-radius:50%; background: var(--slate); }
  .day-pill.edge .day-pill-dot{ background: var(--gold); }
  .day-panel{
    background: var(--navy-2); border:1px solid var(--line);
    border-radius: 14px; padding: 16px;
  }
  .day-panel-head{ display:flex; align-items:baseline; gap:8px; margin-bottom: 12px; }
  .day-date{
    font-family:'JetBrains Mono', monospace; font-size: 12px; color: var(--gold);
  }
  .day-weekday{
    font-family:'Suez One', serif; font-size: 17px;
  }
  .day-notes{
    width:100%; background: var(--field-bg); border:1px solid var(--line);
    border-radius: 8px; color: var(--paper); font-family:'Heebo', sans-serif;
    font-size: 13px; padding: 8px 10px; resize: vertical; min-height: 40px;
    margin-bottom: 14px;
  }
  .day-section-label{
    font-family:'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px;
    color: var(--slate); text-transform: uppercase; margin: 4px 0 6px;
  }
  .day-section{ margin-bottom: 14px; }
  .ref-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom: 8px; }
  .ref-chip{
    display:flex; align-items:center; gap:6px;
    background: var(--field-bg); border:1px solid var(--line); border-radius: 999px;
    padding: 5px 6px 5px 10px; font-size: 12px; font-family:'Heebo', sans-serif;
    cursor:pointer; color: var(--paper);
  }
  .ref-chip .ref-chip-type{ color: var(--gold); font-size: 10px; font-family:'JetBrains Mono', monospace; }
  .ref-chip .ref-chip-del{
    background:none; border:none; color: var(--slate); font-size: 14px; line-height:1; cursor:pointer; padding:0;
  }
  .ref-chip.missing{ opacity: 0.5; text-decoration: line-through; }
  .ref-picker{
    width:100%; background: var(--field-bg); border:1px solid var(--line);
    border-radius: 8px; color: var(--paper); font-family:'Heebo', sans-serif;
    font-size: 13px; padding: 7px 8px; color-scheme: dark;
  }
  body.light .ref-picker{ color-scheme: light; }
  .save-note{
    text-align:center; font-size: 11px; color: var(--slate);
    font-family:'JetBrains Mono', monospace; padding-top: 10px;
    opacity: 0; transition: opacity .3s;
  }
  .save-note.show{ opacity: 1; }
  .save-note.error{ color: var(--red); }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="theme-toggle" id="theme-toggle" title="החלף מצב תצוגה">🌙</button>
    <div class="eyebrow">WORK TRIP</div>
    <h1>לונדון</h1>
    <div class="subtitle">שבוע עבודה — מקומות, ניווט, תקציב וציוד</div>
    <div class="sync-status" id="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">בודק חיבור...</span></div>
  </div>
</header>

<nav class="tabs">
  <div class="wrap" id="tabs-wrap">
    <button class="tab-btn active" data-view="places" draggable="true">מקומות/לינקים</button>
    <button class="tab-btn" data-view="budget" draggable="true">הוצאות</button>
    <button class="tab-btn" data-view="gear" draggable="true">ציוד</button>
    <button class="tab-btn" data-view="tasks" draggable="true">משימות</button>
    <button class="tab-btn" data-view="flights" draggable="true">טיסות</button>
    <button class="tab-btn" data-view="docs" draggable="true">מסמכים</button>
    <button class="tab-btn" data-view="days" draggable="true">ימים</button>
  </div>
</nav>

<div class="wrap">

  <section class="view active" id="view-places">
    <div class="line-track" id="stops-list"></div>
    <div class="add-row"><button class="add-btn" id="add-stop">+ הוסף מקום</button></div>
  </section>

  <section class="view" id="view-budget">
    <div class="budget-summary">
      <div>
        <div class="label">סה"כ הוצאות</div>
        <div class="amount" id="total-actual">£0</div>
        <div class="amount-sub" id="total-actual-sub">≈ ₪0</div>
      </div>
    </div>
    <div id="budget-list"></div>
    <div class="add-row"><button class="add-btn" id="add-budget">+ הוסף הוצאה</button></div>
  </section>

  <section class="view" id="view-gear">
    <div id="gear-list"></div>
    <div class="add-row"><button class="add-btn" id="add-category">+ הוסף קטגוריה</button></div>
  </section>

  <section class="view" id="view-tasks">
    <div id="task-list"></div>
    <div class="add-row"><button class="add-btn" id="add-task-category">+ הוסף קטגוריה</button></div>
  </section>

  <section class="view" id="view-flights">
    <div id="flights-list"></div>
  </section>

  <section class="view" id="view-docs">
    <div id="docs-list"></div>
    <div class="add-row"><button class="add-btn" id="add-doc">+ הוסף מסמך</button></div>
  </section>

  <section class="view" id="view-days">
    <div class="day-strip" id="day-strip"></div>
    <div id="day-content"></div>
  </section>

  <div class="save-note" id="save-note">נשמר</div>
</div>

<script>
// ==================================================
// STORAGE: Firebase Realtime Database (project greece-af497, path "london/")
// Falls back to localStorage if Firebase init/connection fails, so the
// page still works offline or if something is misconfigured.
// ==================================================
const firebaseConfig = {

function updateSyncStatus(){
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-text');
  if(!dot || !text) return;
  if(!fbDb){
    dot.className = 'sync-dot error';
    text.textContent = 'לא מחובר לענן — נשמר רק במכשיר הזה';
    return;
  }
  try{
    fbDb.ref('.info/connected').on('value', (snap)=>{
      if(snap.val() === true){
        dot.className = 'sync-dot ok';
        text.textContent = 'מסונכרן';
      } else {
        dot.className = 'sync-dot error';
        text.textContent = 'לא מחובר — נשמר רק במכשיר הזה';
      }
    });
  }catch(e){
    dot.className = 'sync-dot error';
    text.textContent = 'שגיאת חיבור';
  }
}

window.storage = {
  async get(key){
    if(fbDb){
      try{
        const snap = await fbDb.ref('london/' + key).once('value');
        const v = snap.val();
        if(v !== null && v !== undefined){
          localStorage.setItem('london-cache-' + key, v);
          return { key, value: v };
        }
      }catch(e){ console.warn('Firebase read failed for', key, e); }
    }
    const local = localStorage.getItem('london-cache-' + key);
    return local === null ? null : { key, value: local };
  },
  async set(key, value){
    localStorage.setItem('london-cache-' + key, value);
    if(fbDb){
      await fbDb.ref('london/' + key).set(value);
    }
    return { key, value };
  }
};

// migrate old single-link stops (s.link) to the new s.links array format
function migrateStopLinks(){
  let changed = false;
  stops.forEach(s=>{
    if(!s.links){
      s.links = s.link ? [{ id: cryptoId(), url: s.link }] : [{ id: cryptoId(), url: '' }];
      delete s.link;
      changed = true;
    }
  });
  if(changed) saveStops();
}

function cryptoId(){ return Math.random().toString(36).slice(2,10); }

async function saveWithRetry(key, value){
  for(let attempt=0; attempt<2; attempt++){
    try{
      await window.storage.set(key, value, false);
      flashSave();
      return;
    }catch(e){
      console.error(`save ${key} failed (attempt ${attempt+1})`, e);
      if(attempt === 0) await new Promise(r=>setTimeout(r, 800));
    }
  }
  flashError();
}

function buildMapsHref(val, name){
  val = (val || '').trim();
  if(/^https?:\/\//i.test(val)) return val;
  const q = encodeURIComponent(val || name || '');
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function escapeHtml(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateBudgetTotals(){
  const totalGBP = budgetItems.reduce((a,b)=>{
    const amt = parseFloat(b.actual) || 0;
    return a + (b.currency === 'ILS' ? amt / GBP_TO_ILS : amt);
  }, 0);
  const totalILS = totalGBP * GBP_TO_ILS;
  document.getElementById('total-actual').textContent = '£' + totalGBP.toLocaleString(undefined, {maximumFractionDigits:2});
  document.getElementById('total-actual-sub').textContent = '≈ ₪' + totalILS.toLocaleString(undefined, {maximumFractionDigits:0});
}

function tripDayList(){
  // derived from the flight dates: first day = outbound date, last day = return date
  const outbound = flights.find(f=>f.type === 'outbound');
  const ret = flights.find(f=>f.type === 'return');
  const start = outbound && outbound.date ? outbound.date : '2026-08-30';
  const end = ret && ret.date ? ret.date : '2026-09-07';
  const days = [];
  let cur = new Date(start + 'T12:00:00');
  const last = new Date(end + 'T12:00:00');
  let guard = 0;
  while(cur <= last && guard < 30){
    days.push(cur.toISOString().slice(0,10));
    cur.setDate(cur.getDate() + 1);
    guard++;
  }
  return days;
}

const WEEKDAY_LETTERS = ['א','ב','ג','ד','ה','ו','ש'];

function getDay(iso){
  if(!dayData[iso]) dayData[iso] = { notes:'', items:[], links:[], refs:[] };
  const d = dayData[iso];
  if(!d.items) d.items = [];
  if(!d.links) d.links = [];
  if(!d.refs) d.refs = [];
  return d;
}

function renderDays(){
  const days = tripDayList();
  if(days.length === 0){
    document.getElementById('day-strip').innerHTML = '';
    document.getElementById('day-content').innerHTML = '<div class="empty">אין תאריכי טיסה מוגדרים</div>';
    return;
  }
  if(!activeDayIso || !days.includes(activeDayIso)) activeDayIso = days[0];

  const strip = document.getElementById('day-strip');
  strip.innerHTML = days.map((iso, i) => {
    const date = new Date(iso + 'T12:00:00');
    const isEdge = i === 0 || i === days.length - 1;
    return `
    <button class="day-pill ${iso === activeDayIso ? 'active':''} ${isEdge ? 'edge':''}" data-day="${iso}">
      <span class="day-pill-wd">${WEEKDAY_LETTERS[date.getDay()]}</span>
      <span class="day-pill-num">${date.getDate()}</span>
      <span class="day-pill-dot"></span>
    </button>`;
  }).join('');

  renderDayContent(days);
}

function gcalAllDayLink(title, iso, details){
  const start = iso.replace(/-/g, '');
  const endDate = new Date(iso + 'T12:00:00');
  endDate.setDate(endDate.getDate() + 1);
  const end = endDate.toISOString().slice(0,10).replace(/-/g, '');
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: `${start}/${end}`
  });
  if(details) params.set('details', details);
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function renderDayContent(days){
  days = days || tripDayList();
  const iso = activeDayIso;
  const idx = days.indexOf(iso);
  const date = new Date(iso + 'T12:00:00');
  const weekdayFmt = new Intl.DateTimeFormat('he-IL', { weekday: 'long' });
  const dateFmt = new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'numeric' });
  const label = idx === 0 ? ' — יום הגעה' : (idx === days.length - 1 ? ' — יום חזרה' : '');
  const day = getDay(iso);

  const itemRows = day.items.map(it => `
    <div class="gear-row ${it.checked ? 'checked':''}" data-item-id="${it.id}">
      <input type="checkbox" data-day-item-done="${it.id}" ${it.checked?'checked':''}>
      <input class="gear-name" data-day-item-field="name" placeholder="פריט..." value="${escapeHtml(it.name)}">
      <a class="task-link-toggle" href="${gcalAllDayLink(it.name || 'פריט', iso)}" target="_blank" title="הוסף ליומן Google">📅</a>
      <button class="del-stop" data-del-day-item="${it.id}" title="מחק">×</button>
    </div>`).join('');

  const linkRows = day.links.map(l => {
    const hasLink = l.url && l.url.trim();
    const linkOpen = l.linkOpen !== undefined ? l.linkOpen : !!hasLink;
    return `
    <div class="task-link-item" data-link-id="${l.id}">
      <button class="task-link-toggle ${hasLink ? 'active':''}" data-toggle-day-link="${l.id}" title="קישור">🔗</button>
      <input class="task-link-item-label" data-day-link-field="name" placeholder="שם הקישור" value="${escapeHtml(l.name || '')}">
      <button class="del-stop" data-del-day-link="${l.id}" title="מחק קישור">×</button>
      <div class="task-link-row ${linkOpen ? '':'hidden'}">
        <input type="text" data-day-link-field="url" placeholder="הדבק קישור..." value="${escapeHtml(l.url)}">
        ${hasLink ? `<a class="task-link-open" href="${escapeHtml(l.url)}" target="_blank" title="פתח">↗</a>` : ''}
      </div>
    </div>`;
  }).join('');

  const refChips = day.refs.map(r => {
    let target = null;
    if(r.targetType === 'stop') target = stops.find(s=>s.id === r.targetId);
    else if(r.targetType === 'task') target = taskItems.find(t=>t.id === r.targetId);
    else if(r.targetType === 'doc') target = docs.find(d=>d.id === r.targetId);
    const missing = !target;
    const label = target ? (target.name || '(ללא שם)') : 'פריט נמחק';
    const typeLabel = r.targetType === 'stop' ? 'מקום' : (r.targetType === 'task' ? 'משימה' : 'מסמך');
    return `
    <div class="ref-chip ${missing ? 'missing':''}" data-ref-id="${r.id}" data-ref-type="${r.targetType}">
      <span class="ref-chip-type">${typeLabel}</span>
      <span>${escapeHtml(label)}</span>
      <button class="ref-chip-del" data-del-ref="${r.id}" title="הסר קישור">×</button>
    </div>`;
  }).join('');

  const stopOptions = stops.filter(s=>s.name && s.name.trim() && !s.done).map(s => `<option value="stop:${s.id}">${escapeHtml(s.name)}</option>`).join('');
  const taskOptions = taskItems.filter(t=>t.name && t.name.trim() && !t.checked).map(t => `<option value="task:${t.id}">${escapeHtml(t.name)}</option>`).join('');
  const docOptions = docs.filter(d=>d.name && d.name.trim() && !d.checked).map(d => `<option value="doc:${d.id}">${escapeHtml(d.name)}</option>`).join('');

  document.getElementById('day-content').innerHTML = `
    <div class="day-panel" data-date="${iso}">
      <div class="day-panel-head">
        <span class="day-weekday">${weekdayFmt.format(date)}</span>
        <span class="day-date">${dateFmt.format(date)}${label}</span>
      </div>
      <textarea class="day-notes" data-day-notes="${iso}" placeholder="הערות ותזכורות ליום הזה...">${escapeHtml(day.notes || '')}</textarea>

      <div class="day-section">
        <div class="day-section-label">קשור למקומות / משימות / מסמכים</div>
        <div class="ref-chips">${refChips}</div>
        <select class="ref-picker" data-ref-picker>
          <option value="">+ קשר מקום, משימה או מסמך קיימים...</option>
          ${stopOptions ? `<optgroup label="מקומות">${stopOptions}</optgroup>` : ''}
          ${taskOptions ? `<optgroup label="משימות">${taskOptions}</optgroup>` : ''}
          ${docOptions ? `<optgroup label="מסמכים">${docOptions}</optgroup>` : ''}
        </select>
      </div>

      <div class="day-section">
        <div class="day-section-label">משימות היום</div>
        <div class="gear-items">${itemRows}</div>
        <div class="gear-cat-addrow"><button class="gear-add-item" data-add-day-item="${iso}">+ הוסף פריט</button></div>
      </div>

      <div class="day-section">
        <div class="day-section-label">קישורים</div>
        ${linkRows}
        <div class="gear-cat-addrow"><button class="gear-add-item" data-add-day-link="${iso}">+ הוסף קישור</button></div>
      </div>
    </div>`;
}

document.getElementById('stops-list').addEventListener('click', (e)=>{
  if(e.target.dataset.del){
    const removed = stops.find(s=>s.id === e.target.dataset.del);
    stops = stops.filter(s=>s.id !== e.target.dataset.del);
    if(removed && removed.seedId && !dismissedSeeds.includes(removed.seedId)){
      dismissedSeeds.push(removed.seedId);
      saveWithRetry('london-dismissed-seeds', JSON.stringify(dismissedSeeds));
    }
    renderStops();
    saveStops();
    return;
  }
  if(e.target.dataset.collapse){
    const s = stops.find(x=>x.id === e.target.dataset.collapse);
    if(s){ s.collapsed = !s.collapsed; renderStops(); saveStops(); }
    return;
  }
  if(e.target.dataset.toggleStopLink){
    const stopEl = e.target.closest('.stop');
    if(stopEl){
      const s = stops.find(x=>x.id === stopEl.dataset.id);
      const link = s && (s.links || []).find(l=>l.id === e.target.dataset.toggleStopLink);
      if(link){
        const hasLink = link.url && link.url.trim();
        const current = link.linkOpen !== undefined ? link.linkOpen : !!hasLink;
        link.linkOpen = !current;
        renderStops();
        saveStops();
      }
    }
    return;
  }
  if(e.target.dataset.addLink){
    const s = stops.find(x=>x.id === e.target.dataset.addLink);
    if(s){
      if(!s.links) s.links = [];
      s.links.push({ id: cryptoId(), url: '', linkOpen: true });

      saveStops();
      const container = document.querySelector(`.stop-links[data-links-for="${s.id}"]`);
      if(container){
        const inputs = container.querySelectorAll('.task-link-row input');
        if(inputs.length) inputs[inputs.length-1].focus();
      }
    }
    return;
  }
  if(e.target.dataset.delLink){
    const stopEl = e.target.closest('.stop');
    if(stopEl){
      const s = stops.find(x=>x.id === stopEl.dataset.id);
      if(s && s.links){
        s.links = s.links.filter(l=>l.id !== e.target.dataset.delLink);
        if(s.links.length === 0) s.links.push({ id: cryptoId(), url: '' });
        renderStops();
        saveStops();
      }
    }
  }
});

// ---- drag & drop reordering ----
function reorderArrayFromDOM(containerEl, itemSelector, idAttr, array){
  const ids = Array.from(containerEl.querySelectorAll(itemSelector)).map(el => el.dataset[idAttr]);
  array.sort((a,b) => ids.indexOf(a.id) - ids.indexOf(b.id));
}

function setupDragReorder(container, itemSelector, onDrop){
  let dragging = null;
  container.addEventListener('dragstart', (e)=>{
    if(!e.target.matches(itemSelector)) return;
    dragging = e.target;
    dragging.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', ''); }catch(_){}
  });
  container.addEventListener('dragend', ()=>{
    if(dragging) dragging.classList.remove('dragging');
    dragging = null;
  });
  container.addEventListener('dragover', (e)=>{
    if(!dragging) return;
    const item = e.target.closest(itemSelector);
    if(!item || item === dragging || item.parentNode !== dragging.parentNode) return;
    e.preventDefault();
    const rect = item.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    item.parentNode.insertBefore(dragging, before ? item : item.nextSibling);
  });
  container.addEventListener('drop', (e)=>{
    if(!dragging) return;
    e.preventDefault();
    onDrop();
  });
}

function setupDragReorderHorizontal(container, itemSelector, onDrop){
  let dragging = null;
  container.addEventListener('dragstart', (e)=>{
    if(!e.target.matches(itemSelector)) return;
    dragging = e.target;
    dragging.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', ''); }catch(_){}
  });
  container.addEventListener('dragend', ()=>{
    if(dragging) dragging.classList.remove('dragging');
    dragging = null;
  });
  container.addEventListener('dragover', (e)=>{
    if(!dragging) return;
    const item = e.target.closest(itemSelector);
    if(!item || item === dragging || item.parentNode !== dragging.parentNode) return;
    e.preventDefault();
    const rect = item.getBoundingClientRect();
    const rtl = getComputedStyle(document.documentElement).direction === 'rtl';
    const fromEdge = e.clientX - rect.left;
    const before = rtl ? (fromEdge > rect.width / 2) : (fromEdge < rect.width / 2);
    item.parentNode.insertBefore(dragging, before ? item : item.nextSibling);
  });
  container.addEventListener('drop', (e)=>{
    if(!dragging) return;
    e.preventDefault();
    onDrop();
  });
}

  f[field] = e.target.value;

    card.querySelector('.flight-route').textContent = `${f.from} ← ${f.to}`;
  }
  clearTimeout(window.__flightsSaveT);
  window.__flightsSaveT = setTimeout(saveFlights, 500);
});

document.getElementById('flights-list').addEventListener('blur', (e)=>{
  if(e.target.dataset && e.target.dataset.field){
    clearTimeout(window.__flightsSaveT);
    saveFlights();
    if(e.target.dataset.field === 'date') renderDays();
  }
}, true);

// add doc
document.getElementById('add-doc').addEventListener('click', ()=>{
  docs.push({ id: cryptoId(), name:'', link:'', checked:false });
  renderDocs();
  saveDocs();
  const inputs = document.querySelectorAll('#docs-list .gear-name');
  if(inputs.length) inputs[inputs.length-1].focus();
});

// delegated events - docs
document.getElementById('docs-list').addEventListener('input', (e)=>{
  const row = e.target.closest('.gear-row');
  if(!row) return;
  const field = e.target.dataset.field;
  if(!field) return;
  const d = docs.find(x=>x.id === row.dataset.id);
  if(!d) return;
  d[field] = e.target.value;
  clearTimeout(window.__docsSaveT);
  window.__docsSaveT = setTimeout(saveDocs, 500);
});

document.getElementById('docs-list').addEventListener('change', (e)=>{
  if(e.target.dataset.doneDoc){
    const d = docs.find(x=>x.id === e.target.dataset.doneDoc);
    if(d){ d.checked = e.target.checked; renderDocs(); saveDocs(); }
  }
});

document.getElementById('docs-list').addEventListener('click', (e)=>{
  if(e.target.dataset.delDoc){
    docs = docs.filter(d=>d.id !== e.target.dataset.delDoc);
    renderDocs();
    saveDocs();
    return;
  }
  if(e.target.dataset.toggleDocLink){
    const d = docs.find(x=>x.id === e.target.dataset.toggleDocLink);
    if(d){
      const hasLink = d.link && d.link.trim();
      const current = d.linkOpen !== undefined ? d.linkOpen : !!hasLink;
      d.linkOpen = !current;
      renderDocs();
      saveDocs();
    }
  }
});

document.getElementById('docs-list').addEventListener('blur', (e)=>{
  if(e.target.dataset && e.target.dataset.field){ clearTimeout(window.__docsSaveT); saveDocs(); }
}, true);

// day strip - selecting a day
document.getElementById('day-strip').addEventListener('click', (e)=>{
  const btn = e.target.closest('.day-pill');
  if(!btn) return;
  activeDayIso = btn.dataset.day;
  document.querySelectorAll('.day-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  renderDayContent();
});

// delegated events - day content
document.getElementById('day-content').addEventListener('input', (e)=>{
  const panel = e.target.closest('.day-panel');
  if(!panel) return;
  const iso = panel.dataset.date;
  const day = getDay(iso);

  if(e.target.dataset.dayNotes !== undefined){
    day.notes = e.target.value;
    clearTimeout(window.__dayDataSaveT);
    window.__dayDataSaveT = setTimeout(saveDayData, 500);
    return;
  }
  const itemRow = e.target.closest('[data-item-id]');
  if(itemRow && e.target.dataset.dayItemField){
    const item = day.items.find(it=>it.id === itemRow.dataset.itemId);
    if(item) item[e.target.dataset.dayItemField] = e.target.value;
    clearTimeout(window.__dayDataSaveT);
    window.__dayDataSaveT = setTimeout(saveDayData, 500);
    return;
  }
  const linkItem = e.target.closest('.task-link-item');
  if(linkItem && e.target.dataset.dayLinkField){
    const link = day.links.find(l=>l.id === linkItem.dataset.linkId);
    if(link) link[e.target.dataset.dayLinkField] = e.target.value;
    clearTimeout(window.__dayDataSaveT);
    window.__dayDataSaveT = setTimeout(saveDayData, 500);
  }
});

document.getElementById('day-content').addEventListener('change', (e)=>{
  const panel = e.target.closest('.day-panel');
  if(!panel) return;
  if(e.target.dataset.dayItemDone){
    const day = getDay(panel.dataset.date);
    const item = day.items.find(it=>it.id === e.target.dataset.dayItemDone);
    if(item){ item.checked = e.target.checked; renderDayContent(); saveDayData(); }
    return;
  }
  if(e.target.hasAttribute('data-ref-picker')){
    const val = e.target.value;
    if(!val) return;
    const [targetType, targetId] = val.split(':');
    const day = getDay(panel.dataset.date);
    if(!day.refs.some(r=>r.targetType === targetType && r.targetId === targetId)){
      day.refs.push({ id: cryptoId(), targetType, targetId });
      saveDayData();
    }
    renderDayContent();
  }
});

document.getElementById('day-content').addEventListener('click', (e)=>{
  const panel = e.target.closest('.day-panel');
  if(!panel) return;
  const iso = panel.dataset.date;
  const day = getDay(iso);

  if(e.target.dataset.delRef){
    day.refs = day.refs.filter(r=>r.id !== e.target.dataset.delRef);
    renderDayContent();
    saveDayData();
    return;
  }
  const chip = e.target.closest('.ref-chip');
  if(chip && !chip.classList.contains('missing')){
    const typeToView = { stop: 'places', task: 'tasks', doc: 'docs' };
    const view = typeToView[chip.dataset.refType] || 'places';
    const btn = document.querySelector(`.tab-btn[data-view="${view}"]`);
    if(btn) btn.click();
    return;
  }

  if(e.target.dataset.addDayItem !== undefined && e.target.dataset.addDayItem === iso){
    day.items.push({ id: cryptoId(), name:'', checked:false });
    renderDayContent();
    saveDayData();
    const inputs = document.querySelectorAll('.day-panel .gear-name');
    if(inputs.length) inputs[inputs.length-1].focus();
    return;
  }
  if(e.target.dataset.delDayItem){
    day.items = day.items.filter(it=>it.id !== e.target.dataset.delDayItem);
    renderDayContent();
    saveDayData();
    return;
  }
  if(e.target.dataset.addDayLink !== undefined && e.target.dataset.addDayLink === iso){
    day.links.push({ id: cryptoId(), url:'', linkOpen:true });
    renderDayContent();
    saveDayData();
    return;
  }
  if(e.target.dataset.delDayLink){
    day.links = day.links.filter(l=>l.id !== e.target.dataset.delDayLink);
    renderDayContent();
    saveDayData();
    return;
  }
  if(e.target.dataset.toggleDayLink){
    const link = day.links.find(l=>l.id === e.target.dataset.toggleDayLink);
    if(link){
      const hasLink = link.url && link.url.trim();
      const current = link.linkOpen !== undefined ? link.linkOpen : !!hasLink;
      link.linkOpen = !current;
      renderDayContent();
      saveDayData();
    }
  }
});

document.getElementById('day-content').addEventListener('blur', (e)=>{
  const panel = e.target.closest('.day-panel');
  if(!panel) return;
  if(e.target.dataset.dayNotes !== undefined || e.target.dataset.dayItemField || e.target.dataset.dayLinkField){
    clearTimeout(window.__dayDataSaveT);
    saveDayData();
  }
}, true);

// theme
async function loadTheme(){
  let theme = 'dark';
  try{
    const t = await window.storage.get('london-theme', false);
    if(t) theme = t.value;
  }catch(e){}
  applyTheme(theme);
}
function applyTheme(theme){
  document.body.classList.toggle('light', theme === 'light');
  document.getElementById('theme-toggle').textContent = theme === 'light' ? '☀️' : '🌙';
}
document.getElementById('theme-toggle').addEventListener('click', async ()=>{
  const isLight = document.body.classList.contains('light');
  const next = isLight ? 'dark' : 'light';
  applyTheme(next);
  try{ await window.storage.set('london-theme', next, false); }catch(e){}
});

loadTheme();
loadAll();
</script>
